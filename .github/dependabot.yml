version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Guayaquil
    open-pull-requests-limit: 10
    groups:
      maven-runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      maven-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Guayaquil
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
