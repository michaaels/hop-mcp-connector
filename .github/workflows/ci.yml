name: CI

on:
  workflow_call:
    outputs:
      version:
        description: Maven project version produced by the verification build.
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: Maven artifactId produced by the verification build.
        value: ${{ jobs.build.outputs.artifact }}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.maven.outputs.version }}
      artifact: ${{ steps.maven.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B clean verify
      - name: Test fail-closed verification guards
        run: python3 scripts/ci/test-verification-gates.py
      - name: Require real Linux symlink security coverage
        run: python3 scripts/ci/check-required-tests.py target/surefire-reports
      - name: Read Maven coordinates
        id: maven
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          print("version=" + root.findtext("m:version", namespaces=ns))
          print("artifact=" + root.findtext("m:artifactId", namespaces=ns))
          PY
      - name: Validate Marketplace ZIP
        env:
          VERSION: ${{ steps.maven.outputs.version }}
          ARTIFACT: ${{ steps.maven.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="target/${ARTIFACT}-${VERSION}.zip"
          ROOT="plugins/misc/${ARTIFACT}"
          test -f "$ZIP"
          unzip -l "$ZIP" | grep -F "$ROOT/${ARTIFACT}-${VERSION}.jar"
          unzip -l "$ZIP" | grep -F "$ROOT/version.xml"
          unzip -p "$ZIP" "$ROOT/version.xml" | grep -F "<version>${VERSION}</version>"
          unzip -l "$ZIP" | grep -F "$ROOT/LICENSE"
          unzip -l "$ZIP" | grep -F "$ROOT/NOTICE"
          test -f target/bom.json
          test -f target/bom.xml
          unzip -p "$ZIP" "$ROOT/${ARTIFACT}-${VERSION}.jar" > "$RUNNER_TEMP/${ARTIFACT}-${VERSION}.jar"
          jar tf "$RUNNER_TEMP/${ARTIFACT}-${VERSION}.jar" | grep -Fx 'META-INF/jandex.idx'
          if unzip -l "$ZIP" | grep -E "$ROOT/lib/hop-(core|engine|ui)-"; then
            echo "Apache Hop runtime jars must not be bundled" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hop-mcp-connector-${{ steps.maven.outputs.version }}
          path: |
            target/${{ steps.maven.outputs.artifact }}-${{ steps.maven.outputs.version }}.zip
            target/bom.json
            target/bom.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hop-native-acceptance-helpers
          path: target/${{ steps.maven.outputs.artifact }}-${{ steps.maven.outputs.version }}-tests.jar

  mcp-conformance-2025-11-25:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MCP_CONFORMANCE_RUNNER: 0.2.0-alpha.11
      MCP_CONFORMANCE_REVISION: 2025-11-25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Initialize conformance report directory
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/mcp-conformance-2025-11-25"
          mkdir -p "$REPORT_DIR"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
      - name: Compile the test-only Streamable HTTP adapter
        run: mvn -B -DskipTests test-compile
      - name: Capture environment and requirement set
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          {
            echo "commit=$GITHUB_SHA"
            echo "connector_version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
            java -version
            node --version
            npm --version
            npx --version
            npx --yes "@modelcontextprotocol/conformance@$MCP_CONFORMANCE_RUNNER" --version
          } > "$REPORT_DIR/environment.txt" 2>&1
          npx --yes "@modelcontextprotocol/conformance@$MCP_CONFORMANCE_RUNNER" \
            list --requirements "$MCP_CONFORMANCE_REVISION" > "$REPORT_DIR/requirements.txt"
      - name: Start localhost-only conformance adapter
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR/project"
          mvn -B -DskipTests exec:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=io.github.michaaels.hop.mcp.HopMcpConformanceServer \
            -Dexec.args="--root $REPORT_DIR/project --ready-file $REPORT_DIR/ready.txt --port 0" \
            > "$REPORT_DIR/server.log" 2>&1 &
          echo $! > "$REPORT_DIR/server.pid"
          for attempt in $(seq 1 60); do
            if test -s "$REPORT_DIR/ready.txt"; then break; fi
            sleep 1
          done
          test -s "$REPORT_DIR/ready.txt"
          cat "$REPORT_DIR/ready.txt"
          echo "MCP_CONFORMANCE_URL=$(cat "$REPORT_DIR/ready.txt")" >> "$GITHUB_ENV"
      - name: Run frozen MCP requirement set with explicit regression baseline
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 360s npx --yes "@modelcontextprotocol/conformance@$MCP_CONFORMANCE_RUNNER" \
            server --url "$MCP_CONFORMANCE_URL" \
            --requirements "$MCP_CONFORMANCE_REVISION" \
            --expected-failures ".github/mcp-conformance-2025-11-25-baseline.yml" \
            --output-dir "$REPORT_DIR/results" \
            --verbose 2>&1 | tee "$REPORT_DIR/requirement-set.txt"
      - name: Reject unlisted raw conformance failures
        if: always()
        run: python3 scripts/ci/check-conformance-results.py "$REPORT_DIR/results" .github/mcp-conformance-2025-11-25-baseline.yml
      - name: Stop conformance adapter
        if: always()
        run: |
          set +e
          if test -s "$REPORT_DIR/server.pid"; then
            kill "$(cat "$REPORT_DIR/server.pid")" 2>/dev/null || true
          fi
      - name: Upload MCP conformance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-conformance-2025-11-25
          path: ${{ runner.temp }}/mcp-conformance-2025-11-25

  hop-219-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Download and verify clean Apache Hop baseline
        run: |
          set -euo pipefail
          read -r HOP_VERSION ARTIFACT VERSION < <(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          print(root.findtext("m:properties/m:hop.version", namespaces=ns),
                root.findtext("m:artifactId", namespaces=ns),
                root.findtext("m:version", namespaces=ns))
          PY
          )
          ZIP_PATH=$(find "$GITHUB_WORKSPACE/artifacts" -name "$ARTIFACT-$VERSION.zip" -print -quit)
          test -n "$ZIP_PATH"
          cd "$RUNNER_TEMP"
          HOP_ARCHIVE="apache-hop-client-$HOP_VERSION.zip"
          curl -fL --retry 3 "https://downloads.apache.org/hop/$HOP_VERSION/$HOP_ARCHIVE" -o "$HOP_ARCHIVE"
          curl -fL --retry 3 "https://downloads.apache.org/hop/$HOP_VERSION/$HOP_ARCHIVE.sha512" -o "$HOP_ARCHIVE.sha512"
          sha512sum -c "$HOP_ARCHIVE.sha512"
          mkdir hop-runtime
          unzip -q "$HOP_ARCHIVE" -d hop-runtime
          unzip -q "$ZIP_PATH" -d hop-runtime/hop
      - name: Exercise installed plugin in a clean Hop process
        run: node scripts/ci/hop-smoke.mjs --hop-dir "$RUNNER_TEMP/hop-runtime/hop" --project "$RUNNER_TEMP/hop-smoke-project" --config-dir "$RUNNER_TEMP/hop-config"
      - name: Require native reference equivalence and operational acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hop-acceptance"
          export HOP_CONFIG_FOLDER="$RUNNER_TEMP/hop-config"
          ARTIFACT="${{ needs.build.outputs.artifact }}"
          VERSION="${{ needs.build.outputs.version }}"
          INSTALLED="$RUNNER_TEMP/hop-runtime/hop/plugins/misc/$ARTIFACT/$ARTIFACT-$VERSION.jar"
          HELPERS="$GITHUB_WORKSPACE/artifacts/hop-native-acceptance-helpers/$ARTIFACT-$VERSION-tests.jar"
          ZIP_PATH=$(find "$GITHUB_WORKSPACE/artifacts" -name "$ARTIFACT-$VERSION.zip" -print -quit)
          test -f "$INSTALLED" && test -f "$HELPERS" && test -f "$ZIP_PATH"
          unzip -p "$ZIP_PATH" "plugins/misc/$ARTIFACT/$ARTIFACT-$VERSION.jar" | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/hop-acceptance/expected-jar.sha256"
          sha256sum "$INSTALLED" | awk '{print $1}' > "$RUNNER_TEMP/hop-acceptance/installed-jar.sha256"
          cmp "$RUNNER_TEMP/hop-acceptance/expected-jar.sha256" "$RUNNER_TEMP/hop-acceptance/installed-jar.sha256"
          sha256sum "$ZIP_PATH" > "$RUNNER_TEMP/hop-acceptance/zip.sha256"
          printf 'version=%s\njar=%s\n' "$VERSION" "$INSTALLED" > "$RUNNER_TEMP/hop-acceptance/artifact.txt"
          CLASSPATH="$HELPERS:$INSTALLED:$RUNNER_TEMP/hop-runtime/hop/plugins/misc/$ARTIFACT/lib/*:$RUNNER_TEMP/hop-runtime/hop/lib/core/*:$RUNNER_TEMP/hop-runtime/hop/lib/swt/linux/x86_64/*"
          cd "$RUNNER_TEMP/hop-runtime/hop"
          java -cp "$CLASSPATH" io.github.michaaels.hop.mcp.HopNativeReferenceAcceptance \
            "$RUNNER_TEMP/hop-acceptance/references" "$INSTALLED" | tee "$RUNNER_TEMP/hop-acceptance/references.log"
          java -cp "$CLASSPATH" io.github.michaaels.hop.mcp.HopOperationalFixture \
            "$RUNNER_TEMP/hop-acceptance/project"
          cd "$GITHUB_WORKSPACE"
          node scripts/ci/hop-operational-acceptance.mjs "$RUNNER_TEMP/hop-runtime/hop" \
            "$RUNNER_TEMP/hop-acceptance/project" "$HOP_CONFIG_FOLDER" "$RUNNER_TEMP/hop-acceptance/operational.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hop-219-native-acceptance-evidence
          path: ${{ runner.temp }}/hop-acceptance

  hop-220-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify against the Apache Hop 2.20 snapshot line
        run: mvn -B -P hop-2.20 clean verify
      - name: Require real Linux symlink security coverage
        run: python3 scripts/ci/check-required-tests.py target/surefire-reports

  windows-junction-security:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify on Windows
        run: mvn -B clean verify
      - name: Require Windows junction tests
        if: always()
        run: python scripts/ci/check-windows-junction-tests.py target/surefire-reports
      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-junction-security-reports
          path: target/surefire-reports/
