name: Release 1.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="target/apache-hop-mcp-1.0.0.zip"
          test -f "$ZIP"
          unzip -l "$ZIP" | grep 'plugins/misc/apache-hop-mcp/apache-hop-mcp-1.0.0.jar'
          if unzip -l "$ZIP" | grep -E 'plugins/misc/apache-hop-mcp/lib/hop-(core|engine|ui)-'; then exit 1; fi
          sha256sum "$ZIP" > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; leaving immutable release unchanged."
            exit 0
          fi
          gh release create v1.0.0 target/apache-hop-mcp-1.0.0.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "Apache Hop MCP 1.0.0" --notes-file RELEASE_NOTES.md
