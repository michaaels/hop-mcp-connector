name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Read and validate Maven coordinates
        id: maven
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=ns)
          artifact = root.findtext("m:artifactId", namespaces=ns)
          tag = os.environ["RELEASE_TAG"]
          if tag != "v" + version:
              raise SystemExit(f"Release tag {tag} does not match Maven version {version}")
          if artifact != "hop-mcp-connector":
              raise SystemExit(f"Unexpected release artifactId: {artifact}")
          print("version=" + version)
          print("artifact=" + artifact)
          PY
          if grep -Eiq 'unreleased|pending' RELEASE_NOTES.md; then
            echo "Release notes must describe a completed release, not pending work" >&2
            exit 1
          fi
      - name: Build and verify
        run: mvn -B clean verify
      - name: Validate package and generate checksum
        env:
          VERSION: ${{ steps.maven.outputs.version }}
          ARTIFACT: ${{ steps.maven.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="target/${ARTIFACT}-${VERSION}.zip"
          ROOT="plugins/misc/${ARTIFACT}"
          test -f "$ZIP"
          unzip -l "$ZIP" | grep -F "$ROOT/${ARTIFACT}-${VERSION}.jar"
          unzip -l "$ZIP" | grep -F "$ROOT/LICENSE"
          unzip -l "$ZIP" | grep -F "$ROOT/NOTICE"
          if unzip -l "$ZIP" | grep -E "$ROOT/lib/hop-(core|engine|ui)-"; then exit 1; fi
          test -f target/bom.json
          test -f target/bom.xml
          sha256sum "$ZIP" target/bom.json target/bom.xml > SHA256SUMS.txt
      - name: Attest release archive provenance
        uses: actions/attest@v4
        with:
          subject-path: target/${{ steps.maven.outputs.artifact }}-${{ steps.maven.outputs.version }}.zip
      - name: Attest CycloneDX SBOM
        uses: actions/attest@v4
        with:
          subject-path: target/${{ steps.maven.outputs.artifact }}-${{ steps.maven.outputs.version }}.zip
          sbom-path: target/bom.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.maven.outputs.version }}
          ARTIFACT: ${{ steps.maven.outputs.artifact }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "target/${ARTIFACT}-${VERSION}.zip" \
            target/bom.json target/bom.xml SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "MCP Connector for Apache Hop ${VERSION}" \
            --notes-file RELEASE_NOTES.md
