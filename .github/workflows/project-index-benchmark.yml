name: Project Definition Index Benchmark

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Published stable ancestor tag (blank selects automatically)
        required: false
        type: string
  schedule:
    - cron: '19 5 * * 1'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify index concurrency and bounded scan correctness
        run: mvn -B '-Dtest=HopProjectDefinitionIndexTest,ProjectFilesBoundsTest' test
      - name: Select published baseline
        id: baseline
        env:
          BASELINE_TAG: ${{ inputs.baseline_tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/select-benchmark-baseline.py --candidate "$GITHUB_SHA" --baseline-tag "$BASELINE_TAG" --output "$GITHUB_OUTPUT"
      - name: Benchmark published baseline on shared fixtures
        shell: bash
        env:
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        run: |
          set -euo pipefail
          BASELINE_DIR="$RUNNER_TEMP/hop-mcp-baseline"
          FIXTURES="$RUNNER_TEMP/hop-project-index-fixtures"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_COMMIT"
          mkdir -p "$BASELINE_DIR/src/test/java/io/github/michaaels/hop/mcp"
          cp src/test/java/io/github/michaaels/hop/mcp/HopProjectDefinitionBenchmark.java \
            "$BASELINE_DIR/src/test/java/io/github/michaaels/hop/mcp/HopProjectDefinitionBenchmark.java"
          mvn -B -f "$BASELINE_DIR/pom.xml" clean test-compile
          mvn -B -f "$BASELINE_DIR/pom.xml" \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=io.github.michaaels.hop.mcp.HopProjectDefinitionBenchmark \
            "-Dexec.args=$FIXTURES $RUNNER_TEMP/benchmark-baseline.json baseline" \
            exec:java
      - name: Benchmark current commit on the same fixtures
        shell: bash
        run: |
          set -euo pipefail
          FIXTURES="$RUNNER_TEMP/hop-project-index-fixtures"
          mvn -B clean test-compile
          mvn -B \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=io.github.michaaels.hop.mcp.HopProjectDefinitionBenchmark \
            "-Dexec.args=$FIXTURES $RUNNER_TEMP/benchmark-current.json current" \
            exec:java
      - name: Validate results and write comparison summary
        env:
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        run: |
          python3 scripts/ci/compare-project-index-benchmarks.py \
            --baseline "$RUNNER_TEMP/benchmark-baseline.json" \
            --current "$RUNNER_TEMP/benchmark-current.json" \
            --baseline-ref "$BASELINE_TAG@$BASELINE_COMMIT" \
            --current-ref "$GITHUB_SHA" \
            --json benchmark.json \
            --csv benchmark.csv \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-index-benchmark-${{ github.run_id }}
          path: |
            benchmark.json
            benchmark.csv
          if-no-files-found: error
