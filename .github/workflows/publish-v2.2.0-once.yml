name: Publish v2.2.0 once

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    if: github.event.head_commit.message == 'publish-v2.2.0-once'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: cc95da2ffea24c16c2bd35d5589a6abe89b3f5e7
      VERIFY_RUN: "35967372219"
      TAG: v2.2.0
      VERSION: 2.2.0
      ARTIFACT: hop-mcp-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2.2.0
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit, tag, and successful CI gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_SHA"
          RUN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFY_RUN" --jq .head_sha)"
          RUN_CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFY_RUN" --jq .conclusion)"
          test "$RUN_SHA" = "$RELEASE_SHA"
          test "$RUN_CONCLUSION" = "success"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=ns)
          artifact = root.findtext("m:artifactId", namespaces=ns)
          assert version == "2.2.0", version
          assert artifact == "hop-mcp-connector", artifact
          PY
          if grep -Eiq 'unreleased|pending|prepared|not published|not released' RELEASE_NOTES.md; then
            echo "Release notes contain a non-final release marker" >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hop-mcp-connector-2.2.0
          path: target
          run-id: 35967372219
          github-token: ${{ github.token }}
      - name: Validate verified Marketplace package and create checksums
        shell: bash
        run: |
          set -euo pipefail
          ZIP="target/$ARTIFACT-$VERSION.zip"
          ROOT="plugins/misc/$ARTIFACT"
          test -f "$ZIP"
          test -f target/bom.json
          test -f target/bom.xml
          unzip -l "$ZIP" | grep -F "$ROOT/$ARTIFACT-$VERSION.jar"
          unzip -l "$ZIP" | grep -F "$ROOT/version.xml"
          unzip -p "$ZIP" "$ROOT/version.xml" | grep -F "<version>$VERSION</version>"
          unzip -l "$ZIP" | grep -F "$ROOT/LICENSE"
          unzip -l "$ZIP" | grep -F "$ROOT/NOTICE"
          unzip -p "$ZIP" "$ROOT/$ARTIFACT-$VERSION.jar" > "$RUNNER_TEMP/$ARTIFACT-$VERSION.jar"
          jar tf "$RUNNER_TEMP/$ARTIFACT-$VERSION.jar" | grep -Fx 'META-INF/jandex.idx'
          if unzip -l "$ZIP" | grep -E "$ROOT/lib/hop-(core|engine|ui)-"; then
            echo "Apache Hop runtime jars must not be bundled" >&2
            exit 1
          fi
          sha256sum "$ZIP" target/bom.json target/bom.xml > SHA256SUMS.txt
      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/hop-mcp-connector-2.2.0.zip
      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/hop-mcp-connector-2.2.0.zip
          sbom-path: target/bom.json
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG"             "target/$ARTIFACT-$VERSION.zip"             target/bom.json target/bom.xml SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "MCP Connector for Apache Hop $VERSION"             --notes-file RELEASE_NOTES.md
