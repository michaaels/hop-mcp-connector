name: Same Runner Benchmark Comparison

on:
  push:
    branches:
      - benchmark/main-20260924

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preserve benchmark harness
        shell: bash
        run: |
          cp src/test/java/io/github/michaaels/hop/mcp/HopImpactPerformanceBenchmarkTest.java "$RUNNER_TEMP/benchmark.java"
      - name: Benchmark v2.2.0 baseline
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach cc95da2ffea24c16c2bd35d5589a6abe89b3f5e7
          cp "$RUNNER_TEMP/benchmark.java" src/test/java/io/github/michaaels/hop/mcp/HopImpactPerformanceBenchmarkTest.java
          echo "BENCHMARK_VERSION baseline-v2.2.0"
          mvn -B -Dhop.benchmark=true -Dtest=HopImpactPerformanceBenchmarkTest test
      - name: Benchmark optimized 2.2.1 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach e1f1dff48e0ba59379050f57af4f1021c428472c
          cp "$RUNNER_TEMP/benchmark.java" src/test/java/io/github/michaaels/hop/mcp/HopImpactPerformanceBenchmarkTest.java
          echo "BENCHMARK_VERSION optimized-2.2.1-SNAPSHOT"
          mvn -B -Dhop.benchmark=true -Dtest=HopImpactPerformanceBenchmarkTest test
