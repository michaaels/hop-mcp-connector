name: Performance Benchmark

on:
  push:
    branches:
      - benchmark/v2.2.0-20260924
      - benchmark/main-20260924

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run synthetic 1k/2.5k/5k definition benchmark
        run: mvn -B -Dhop.benchmark=true -Dtest=HopImpactPerformanceBenchmarkTest test
